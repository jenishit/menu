<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aago Aroma — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #110D0B;
      --surface:   #1C1512;
      --ember:     #D4622A;
      --gold:      #C99B5A;
      --cream:     #F0E4CE;
      --muted:     #7A6A5A;
      --line:      rgba(201,155,90,.18);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── GRAIN OVERLAY ───────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: .035;
    }

    /* ── AMBIENT GLOW ────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      top: -30vh; left: 50%; transform: translateX(-50%);
      width: 80vw; height: 60vh;
      background: radial-gradient(ellipse at center, rgba(212,98,42,.13) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    /* ── HEADER ──────────────────────────────── */
    header {
      position: relative; z-index: 10;
      text-align: center;
      padding: 80px 24px 60px;
    }

    .flame-bar {
      display: flex; justify-content: center; align-items: center;
      gap: 14px; margin-bottom: 32px;
      opacity: 0; animation: fadeUp .8s .1s ease forwards;
    }
    .flame-bar span {
      display: block; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      width: 80px;
    }
    .flame-icon { font-size: 22px; filter: drop-shadow(0 0 8px rgba(212,98,42,.8)); }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(52px, 10vw, 96px);
      font-weight: 300;
      letter-spacing: .08em;
      line-height: 1;
      color: var(--cream);
      opacity: 0; animation: fadeUp .9s .2s ease forwards;
    }
    header h1 em {
      font-style: italic;
      color: var(--gold);
      font-weight: 300;
    }

    .tagline {
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: .35em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0; animation: fadeUp .9s .4s ease forwards;
    }

    .divider {
      width: 1px; height: 60px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      margin: 48px auto 0;
      opacity: 0; animation: fadeUp .9s .5s ease forwards;
    }

    /* ── MAIN ────────────────────────────────── */
    main {
      position: relative; z-index: 5;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 24px 120px;
    }

    /* ── CATEGORY BLOCK ──────────────────────── */
    .category {
      margin-top: 70px;
      opacity: 0;
      transform: translateY(28px);
      transition: opacity .7s ease, transform .7s ease;
    }
    .category.visible { opacity: 1; transform: translateY(0); }

    .category-header {
      display: flex; align-items: center; gap: 18px;
      margin-bottom: 28px;
    }
    .category-header h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(28px, 5vw, 38px);
      font-weight: 300;
      letter-spacing: .04em;
      color: var(--cream);
      white-space: nowrap;
    }
    .category-header h2 .cat-num {
      font-size: 13px;
      letter-spacing: .2em;
      color: var(--ember);
      vertical-align: super;
      margin-right: 8px;
      font-family: 'Jost', sans-serif;
      font-weight: 200;
    }
    .cat-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, var(--line), transparent);
    }

    /* ── SUBCATEGORY ─────────────────────────── */
    .subcategory-label {
      font-size: 10px;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--ember);
      margin: 36px 0 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .subcategory-label::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(to right, rgba(212,98,42,.3), transparent);
    }

    /* ── MENU ITEM ───────────────────────────── */
    .menu-item {
      display: flex; align-items: baseline;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      position: relative;
      cursor: default;
      transition: padding-left .25s ease;
    }
    .menu-item::before {
      content: '';
      position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
      width: 3px; height: 0;
      background: var(--ember);
      border-radius: 2px;
      transition: height .25s ease;
    }
    .menu-item:hover { padding-left: 10px; }
    .menu-item:hover::before { height: 60%; }

    .item-name {
      font-size: 15px;
      font-weight: 300;
      letter-spacing: .04em;
      color: var(--cream);
      max-width: 75%;
      line-height: 1.4;
    }
    .item-dots {
      flex: 1;
      border-bottom: 1px dotted rgba(201,155,90,.2);
      margin: 0 12px;
      position: relative; top: -4px;
    }
    .item-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 400;
      color: var(--gold);
      white-space: nowrap;
      letter-spacing: .03em;
    }
    .item-price .currency {
      font-size: 11px;
      letter-spacing: .1em;
      opacity: .7;
      margin-right: 2px;
      font-family: 'Jost', sans-serif;
      font-weight: 200;
    }

    /* ── COMBO GRID ──────────────────────────── */
    .combo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 8px;
    }
    @media (max-width: 560px) { .combo-grid { grid-template-columns: 1fr; } }

    .combo-card {
      background: rgba(28,21,18,.7);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 24px 20px 20px;
      position: relative;
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: border-color .3s ease, background .3s ease;
    }
    .combo-card::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--ember), var(--gold));
      opacity: 0;
      transition: opacity .3s ease;
    }
    .combo-card:hover { border-color: rgba(201,155,90,.32); background: rgba(32,24,18,.85); }
    .combo-card:hover::after { opacity: 1; }

    /* Jumbo card spans full width */
    .combo-card.jumbo { grid-column: 1 / -1; }

    .combo-size {
      font-size: 9px; letter-spacing: .38em;
      text-transform: uppercase; color: var(--ember);
      margin-bottom: 16px;
    }

    /* ingredient pills */
    .combo-items {
      display: flex; flex-wrap: wrap; gap: 6px;
      flex: 1;
    }
    .combo-pill {
      font-size: 11.5px; font-weight: 300; letter-spacing: .03em;
      color: rgba(240,228,206,.75);
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(201,155,90,.12);
      border-radius: 1px;
      padding: 4px 10px;
      line-height: 1.4;
      white-space: nowrap;
    }
    .combo-pill.highlight {
      color: var(--gold);
      background: rgba(201,155,90,.07);
      border-color: rgba(201,155,90,.22);
    }

    .combo-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 18px; padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .combo-serves {
      font-size: 10px; letter-spacing: .18em;
      text-transform: uppercase; color: var(--muted);
    }
    .combo-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px; font-weight: 400;
      color: var(--gold); line-height: 1;
    }
    .combo-price .currency {
      font-size: 11px; font-family: 'Jost', sans-serif;
      font-weight: 200; letter-spacing: .1em;
      margin-right: 2px; opacity: .65;
    }

    /* ── FOOTER ──────────────────────────────── */
    footer {
      position: relative; z-index: 5;
      text-align: center;
      padding: 40px 24px;
      border-top: 1px solid var(--line);
    }
    footer p {
      font-size: 11px; letter-spacing: .25em;
      text-transform: uppercase; color: var(--muted);
    }

    /* ── ANIMATIONS ──────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SCROLLBAR ───────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--ember); border-radius: 2px; }
  </style>
</head>

<body>
  <header>
    <div class="flame-bar">
      <span></span>
      <span class="flame-icon">🔥</span>
      <span></span>
    </div>
    <h1><em>Aago</em> Aroma</h1>
    <p class="tagline">Where Fire Crafts Flavor</p>
    <div class="divider"></div>
  </header>

  <main id="menu-container"></main>

  <footer>
    <p>Aago Aroma &nbsp;·&nbsp; All prices in NPR &nbsp;·&nbsp; Subject to change</p>
  </footer>

  <script src="script.js">
  </script>
</body>
</html>
